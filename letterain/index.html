<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07141d" />
    <title>Letterain — IO-Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="Letterain generative artwork">
      <canvas id="artworkCanvas"></canvas>

      <section class="panel" aria-label="Artwork description">
        <div class="panel-header">
          <h1>Letterain</h1>
          <div class="panel-actions">
            <button
              id="soundToggle"
              class="sound-toggle"
              type="button"
              aria-label="Turn sound on"
              aria-pressed="false"
              title="Sound off"
            >
              <span id="soundIcon" class="sound-icon" aria-hidden="true">🔇</span>
            </button>
            <button
              id="panelToggle"
              class="panel-toggle"
              type="button"
              aria-label="Show artwork controls"
              aria-controls="panelDetails"
              aria-expanded="true"
            >
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <p class="panel-description">Letters fall and fracture as rain.</p>

        <div id="panelDetails" class="panel-details">
          <div class="density-control">
            <label for="density">
              <span>Density</span>
              <output id="densityValue" for="density">100%</output>
            </label>
            <input
              id="density"
              type="range"
              min="50"
              max="300"
              step="10"
              value="100"
              aria-label="Letter density"
            />
          </div>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
