<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07141d" />
    <title>Letterain — IO-Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="Letterain generative artwork">
      <canvas id="artworkCanvas"></canvas>

      <section class="panel" aria-label="Artwork description">
        <div>
          <h1>Letterain</h1>
          <p>Letters fall, fracture, and return as rain.</p>
          <div class="density-control">
            <label for="density">
              <span>Density</span>
              <output id="densityValue" for="density">100%</output>
            </label>
            <input
              id="density"
              type="range"
              min="50"
              max="300"
              step="10"
              value="100"
              aria-label="Letter density"
            />
          </div>
          <div class="sound-control">
            <span>Sound</span>
            <button
              id="soundToggle"
              type="button"
              aria-pressed="false"
            >Off</button>
          </div>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
